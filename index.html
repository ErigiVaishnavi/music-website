<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christhava Sunadha Keerthanalu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <img src="logo.png" alt="Logo">
                <div>
                    <span class="brand-title">Christhava</span>
                    <span class="brand-sub">Sunadha Keerthanalu</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" class="nav-item" data-view="search">
                    <i class="fas fa-search"></i> Search
                </a>
            </nav>

            <div class="sidebar-playlist">
                <p class="sidebar-label">Playlist</p>
                <div class="sidebar-playlist-card">
                    <img src="covers/1.png" alt="Playlist cover" id="sidebarCover">
                    <div>
                        <p class="sidebar-playlist-name" id="sidebarPlaylistName">Keerthanalu</p>
                        <p class="sidebar-playlist-count" id="sidebarSongCount">— songs</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">
            <header class="main-header">
                <div class="search-bar" id="searchBar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search keerthanalu..." autocomplete="off">
                </div>
            </header>

            <div class="main-content" id="mainContent">
                <!-- Hero -->
                <section class="hero">
                    <div class="hero-cover">
                        <img src="covers/1.png" alt="Playlist" id="heroCover">
                    </div>
                    <div class="hero-info">
                        <span class="hero-type">Playlist</span>
                        <h1 id="heroTitle">Christhava Sunadha Keerthanalu</h1>
                        <p class="hero-desc">Find the song list below and rejoice in Jesus</p>
                        <p class="hero-meta">
                            <span id="heroArtist">Christhava Sunadha Keerthanalu</span>
                            <span class="dot">·</span>
                            <span id="heroSongCount">— songs</span>
                        </p>
                    </div>
                </section>

                <!-- Controls -->
                <div class="playlist-controls">
                    <button class="btn-play-all" id="playAllBtn" title="Play all">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="btn-shuffle" id="shuffleBtn" title="Shuffle">
                        <i class="fas fa-random"></i>
                    </button>
                </div>

                <!-- Song table -->
                <section class="song-table-section">
                    <div class="song-table-header">
                        <span class="col-index">#</span>
                        <span class="col-title">Title</span>
                        <span class="col-album">Album</span>
                        <span class="col-duration"><i class="far fa-clock"></i></span>
                    </div>
                    <div class="song-list" id="songList">
                        <!-- Dynamically rendered -->
                    </div>
                </section>
            </div>

            <!-- Search empty state -->
            <div class="empty-state hidden" id="emptyState">
                <i class="fas fa-music"></i>
                <p>No songs found</p>
            </div>
        </main>
    </div>

    <!-- Player bar -->
    <footer class="player">
        <div class="player-track">
            <img src="covers/1.png" alt="" id="playerCover" class="player-cover">
            <div class="player-track-info">
                <span class="player-song-name" id="masterSongName">Select a song</span>
                <span class="player-artist" id="playerArtist">Christhava Sunadha Keerthanalu</span>
            </div>
            <img src="playing.gif" alt="" id="gif" class="player-gif">
        </div>

        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-btn" id="shuffleToggle" title="Shuffle"><i class="fas fa-random"></i></button>
                <button class="player-btn" id="previous"><i class="fas fa-step-backward"></i></button>
                <button class="player-btn player-btn-main" id="masterPlay"><i class="fas fa-play"></i></button>
                <button class="player-btn" id="next"><i class="fas fa-step-forward"></i></button>
                <button class="player-btn" id="repeatToggle" title="Repeat"><i class="fas fa-redo"></i></button>
            </div>
            <div class="player-progress">
                <span class="time-current" id="timeCurrent">0:00</span>
                <input type="range" id="myProgressBar" min="0" value="0" max="100">
                <span class="time-total" id="timeTotal">0:00</span>
            </div>
        </div>

        <div class="player-volume">
            <button class="player-btn" id="volumeBtn"><i class="fas fa-volume-up"></i></button>
            <input type="range" id="volumeBar" min="0" max="100" value="80">
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
